spring.application.name=Insurance_Policy_System

# =========================
# DATABASE
# =========================


spring.datasource.url=jdbc:mysql://localhost:3306/Insurance?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate will automatically create/update tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
services.customer.url=http://localhost:8081
services.policy.url=http://localhost:8082
services.premium.url=http://localhost:8083
# Document Service ka actual port use karna
services.document.url=http://localhost:8084
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_ENABLED:true}
management.endpoints.web.exposure.include=health,info
spring.cloud.compatibility-verifier.enabled=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

services.product.url=http://localhost:8084
claim.payout.provider=mock
